<script>
(function () {
  "use strict";

  const codeList = () => window.PAITE_DATA.codes.map((item) => item.code);

  function recordedIntervals(intervals) {
    return intervals.filter(
      (interval) =>
        Boolean(interval.savedAt) ||
        interval.codes.length > 0 ||
        interval.notes.trim().length > 0,
    );
  }

  function getCodeTotals(intervals) {
    const totals = Object.fromEntries(codeList().map((code) => [code, 0]));
    recordedIntervals(intervals).forEach((interval) => {
      interval.codes.forEach((code) => {
        if (Object.prototype.hasOwnProperty.call(totals, code)) {
          totals[code] += 1;
        }
      });
    });
    return totals;
  }

  function getCodePercentages(intervals) {
    const observed = recordedIntervals(intervals).length;
    const totals = getCodeTotals(intervals);
    return Object.fromEntries(
      Object.entries(totals).map(([code, total]) => [
        code,
        observed ? Math.round((total / observed) * 100) : 0,
      ]),
    );
  }

  function getRankedCodes(intervals) {
    const totals = getCodeTotals(intervals);
    const percentages = getCodePercentages(intervals);
    return window.PAITE_DATA.codes
      .map((item) => ({
        ...item,
        total: totals[item.code],
        percentage: percentages[item.code],
      }))
      .sort((a, b) => b.total - a.total || a.code.localeCompare(b.code));
  }

  function getSegmentTotals(intervals, segmentMinutes = 10) {
    const segments = new Map();
    recordedIntervals(intervals).forEach((interval) => {
      const segmentIndex = Math.floor(interval.startMin / segmentMinutes);
      if (!segments.has(segmentIndex)) {
        segments.set(segmentIndex, {
          index: segmentIndex,
          startMin: segmentIndex * segmentMinutes,
          endMin: (segmentIndex + 1) * segmentMinutes,
          intervalCount: 0,
          totals: Object.fromEntries(codeList().map((code) => [code, 0])),
        });
      }
      const segment = segments.get(segmentIndex);
      segment.intervalCount += 1;
      interval.codes.forEach((code) => {
        if (Object.prototype.hasOwnProperty.call(segment.totals, code)) {
          segment.totals[code] += 1;
        }
      });
    });
    return Array.from(segments.values()).sort((a, b) => a.index - b.index);
  }

  function getSummary(intervals) {
    const observed = recordedIntervals(intervals);
    const ranked = getRankedCodes(intervals);
    return {
      recordedCount: observed.length,
      practiceCount: ranked.filter((item) => item.code !== "O" && item.total > 0)
        .length,
      totalCodeMarks: ranked.reduce((sum, item) => sum + item.total, 0),
      ranked,
      segments: getSegmentTotals(intervals),
    };
  }

  window.PAITE_SCORING = {
    recordedIntervals,
    getCodeTotals,
    getCodePercentages,
    getRankedCodes,
    getSegmentTotals,
    getSummary,
  };
})();

</script>
<script>

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function instructorDisplay(meta) {
    return (meta.instructorId || meta.instructor || "").trim() || "Not recorded";
  }

  function icon(name, className = "icon") {
    const icons = {
      check:
        '<path d="m5 12 4 4L19 6"/><path d="M21 12a9 9 0 1 1-5.3-8.2"/>',
      checkPlain: '<path d="m5 12 4 4L19 6"/>',
      pause: '<path d="M8 5v14M16 5v14"/>',
      play: '<path d="m8 5 11 7-11 7Z"/>',
      arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      arrowLeft: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
      trash:
        '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/>',
      menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
      close: '<path d="m6 6 12 12M18 6 6 18"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
      download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
      print:
        '<path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7Z"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      users:
        '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5Z"/><path d="M4 6.5v13"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      calendar:
        '<path d="M6 2v4M18 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"/>',
      edit: '<path d="m14 4 6 6M4 20l4.5-1 11-11a2 2 0 0 0-6-6l-11 11L2 18Z"/>',
      mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    };
    return `<svg class="${className}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name] || ""}</svg>`;
  }

  function announce(message) {
    announcer.textContent = "";
    window.setTimeout(() => {
      announcer.textContent = message;
    }, 30);
  }

  const storage = (() => {
    try {
      const testKey = "__paite_test__";
      window.localStorage.setItem(testKey, "1");
      window.localStorage.removeItem(testKey);
      return window.localStorage;
    } catch (_error) {
      const memory = new Map();
      return {
        getItem: (key) => (memory.has(key) ? memory.get(key) : null),
        setItem: (key, value) => memory.set(key, String(value)),
        removeItem: (key) => memory.delete(key),
      };
    }
  })();

  function safeParse(value, fallback) {
    try {
      return value ? JSON.parse(value) : fallback;
    } catch (_error) {
      return fallback;
    }
  }

  function getHistory() {
    const history = safeParse(storage.getItem(HISTORY_KEY), []);
    return Array.isArray(history) ? history : [];
  }

  function saveHistory(history) {
    storage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function persistDraft() {
    if (!state.observation || state.observation.status !== "active") return;
    state.observation.updatedAt = new Date().toISOString();
    storage.setItem(DRAFT_KEY, JSON.stringify(state.observation));
    updateAutosaveLabel();
  }

  function normalizeObservation(observation) {
    if (!observation || !observation.metadata || !Array.isArray(observation.intervals)) {
      return null;
    }
    observation.timer = observation.timer || {
      elapsedSeconds: 0,
      running: false,
      lastStartedAt: null,
    };
    observation.currentIntervalIndex = Math.max(
      0,
      Math.min(observation.currentIntervalIndex || 0, observation.intervals.length - 1),
    );
    observation.intervals = observation.intervals.map((interval, index) => ({
      index,
      startMin: index * DATA.intervalMinutes,
      endMin: Math.min(
        (index + 1) * DATA.intervalMinutes,
        Number(observation.metadata.classLength),
      ),
      codes: Array.isArray(interval.codes) ? interval.codes : [],
      notes: interval.notes || "",
      savedAt: interval.savedAt || null,
    }));
    return observation;
  }

  function loadInitialState() {
    const draft = normalizeObservation(safeParse(storage.getItem(DRAFT_KEY), null));
    if (draft && draft.status === "active") {
      state.observation = draft;
      state.screen = "observation";
    }
  }

  function formatTimer(totalSeconds) {
    const seconds = Math.max(0, Math.floor(totalSeconds));
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const remaining = seconds % 60;
    if (hours > 0) {
      return `${hours}:${String(minutes).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`;
    }
    return `${String(minutes).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`;
  }

  function getElapsedSeconds(observation = state.observation) {
    if (!observation) return 0;
    const timer = observation.timer;
    if (!timer.running || !timer.lastStartedAt) return timer.elapsedSeconds || 0;
    const delta = Math.max(0, Date.now() - new Date(timer.lastStartedAt).getTime());
    return (timer.elapsedSeconds || 0) + Math.floor(delta / 1000);
  }

  function syncTimer() {
    if (!state.observation) return;
    const timer = state.observation.timer;
    if (timer.running) {
      timer.elapsedSeconds = getElapsedSeconds();
      timer.lastStartedAt = new Date().toISOString();
    }
  }

  function intervalLabel(interval) {
    return `${interval.startMin}–${interval.endMin} min`;
  }

  function createObservation(formData) {
    const classLength = Math.min(
      DATA.maxClassMinutes,
      Math.max(DATA.intervalMinutes, Number(formData.get("classLength")) || 60),
    );
    const intervalCount = Math.ceil(classLength / DATA.intervalMinutes);
    const now = new Date().toISOString();
    return {
      id: `paite-${Date.now()}-${Math.random().toString(16).slice(2)}`,
      status: "active",
      createdAt: now,
      updatedAt: now,
      completedAt: null,
      metadata: {
        date: formData.get("date"),
        course: formData.get("course").trim(),
        instructorId: formData.get("instructorId").trim(),
        instructorEmail: (formData.get("instructorEmail") || "").trim(),
        studentCount: Number(formData.get("studentCount")) || 0,
        observer: formData.get("observer").trim(),
        classLength,
        classStructure: formData.get("classStructure") || "",
        preObservationNotes: (formData.get("preObservationNotes") || "").trim(),
        classroomArrangement: formData.get("classroomArrangement").trim(),
        groupObservations: formData.get("groupObservations").trim(),
        accessibilityObservations: formData
          .get("accessibilityObservations")
          .trim(),
      },
      timer: {
        elapsedSeconds: 0,
        running: true,
        lastStartedAt: now,
      },
      currentIntervalIndex: 0,
      intervals: Array.from({ length: intervalCount }, (_, index) => ({
        index,
        startMin: index * DATA.intervalMinutes,
        endMin: Math.min((index + 1) * DATA.intervalMinutes, classLength),
        codes: [],
        notes: "",
        savedAt: null,
      })),
    };
  }

  function renderHeader() {
    const inObservation = state.screen === "observation";
    return `
      <header class="app-header print-hidden">
        <button class="brand" data-action="go-setup" aria-label="PAITE home">PAITE</button>
        <button class="mobile-menu-button" data-action="toggle-mobile-nav" aria-expanded="${state.mobileNavOpen}">
          ${icon(state.mobileNavOpen ? "close" : "menu")}
          <span class="sr-only">Toggle navigation</span>
        </button>
        <nav class="primary-nav ${state.mobileNavOpen ? "is-open" : ""}" aria-label="Primary navigation">
          <button class="nav-link ${state.screen === "observation" || state.screen === "setup" ? "is-active" : ""}" data-action="go-observation">
            Observation
          </button>
          <button class="nav-link ${state.screen === "history" ? "is-active" : ""}" data-action="go-history">
            History
          </button>
          <button class="nav-link" data-action="open-guide">Code guide</button>
        </nav>
        <div class="header-actions">
          ${
            inObservation
              ? `<button class="button button-primary button-compact" data-action="finish-observation">${icon("checkPlain")} Save &amp; finish</button>`
              : state.observation && state.observation.status === "active"
                ? `<button class="button button-primary button-compact" data-action="go-observation">Resume observation</button>`
                : ""
          }
        </div>
      </header>
    `;
  }

  function renderSetup() {
    const today = new Date().toISOString().slice(0, 10);
    return `
      <main id="main-content" class="setup-page">
        <section class="setup-intro">
          <h1>Start a classroom observation</h1>
          <p>Record PAITE teaching behaviors in 2-minute intervals. Your work stays in this browser.</p>
        </section>

        <form id="setup-form" class="setup-form">
          <div class="form-section">
            <div class="section-heading">
              <h2>Observation details</h2>
              <button type="button" class="text-button print-hidden" data-action="fill-demo">Use demo data</button>
            </div>
            <div class="form-grid form-grid-three">
              <label class="field">
                <span>Date</span>
                <input type="date" name="date" value="${today}" required />
              </label>
              <label class="field">
                <span>Course or class</span>
                <input type="text" name="course" placeholder="BIO 204" maxlength="80" required />
              </label>
              <label class="field">
                <span>Class length</span>
                <span class="input-with-suffix">
                  <input type="number" name="classLength" min="2" max="120" step="2" value="60" required />
                  <span>minutes</span>
                </span>
              </label>
              <label class="field">
                <span>Instructor Name or ID</span>
                <input type="text" name="instructorId" placeholder="Dr. Rivera or FAC-1042" maxlength="80" required />
              </label>
              <label class="field">
                <span>Instructor email <small>optional</small></span>
                <input type="email" name="instructorEmail" placeholder="rivera@example.edu" maxlength="120" />
              </label>
              <label class="field">
                <span>Number of students present</span>
                <input type="number" name="studentCount" min="0" max="1000" placeholder="24" required />
              </label>
              <label class="field">
                <span>Observer name</span>
                <input type="text" name="observer" placeholder="M. Chen" maxlength="80" required />
              </label>
              <label class="field">
                <span>Class structure <small>optional</small></span>
                <select name="classStructure">
                  <option value="">Select level</option>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                </select>
              </label>
            </div>
          </div>

          <div class="form-section">
            <h2>Class context</h2>
            <div class="form-grid form-grid-two">
              <label class="field field-wide">
                <span>Pre-observation notes <small>instructor's teaching goals for this session</small></span>
                <textarea name="preObservationNotes" rows="3" maxlength="500" placeholder="What the instructor wants to accomplish or focus on this session..."></textarea>
              </label>
              <label class="field field-wide">
                <span>Classroom arrangement</span>
                <textarea name="classroomArrangement" rows="3" maxlength="500" placeholder="Auditorium seating, seminar table, lab benches in groups of four..."></textarea>
              </label>
              <label class="field field-wide">
                <span>Group observations</span>
                <textarea name="groupObservations" rows="3" maxlength="500" placeholder="How groups are designed to support inclusion..."></textarea>
              </label>
              <label class="field field-wide">
                <span>Accessibility observations</span>
                <textarea name="accessibilityObservations" rows="3" maxlength="500" placeholder="Room, materials, or activities that support learner accessibility..."></textarea>
              </label>
            </div>
          </div>

          <div class="setup-actions">
            <button type="button" class="text-button danger-text" data-action="clear-all-data">Clear all data from this browser</button>
            <button type="button" class="button button-secondary" data-action="open-guide">Review PAITE codes</button>
            <button type="submit" class="button button-primary">Start observation ${icon("arrowRight")}</button>
          </div>
        </form>
      </main>
    `;
  }

  function renderMetaStrip(observation) {
    const meta = observation.metadata;
    const elapsed = getElapsedSeconds(observation);
    const progress = Math.min(100, Math.round((elapsed / (meta.classLength * 60)) * 100));
    return `
      <section class="observation-strip print-hidden" aria-label="Observation status">
        <div class="meta-list">
          <div class="meta-item">${icon("user", "meta-icon")}<div><span>Instructor</span><strong>${escapeHtml(instructorDisplay(meta))}</strong></div></div>
          <div class="meta-item">${icon("book", "meta-icon")}<div><span>Course</span><strong>${escapeHtml(meta.course)}</strong></div></div>
          <div class="meta-item">${icon("users", "meta-icon")}<div><span>Students</span><strong>${meta.studentCount}</strong></div></div>
          <div class="meta-item meta-observer">${icon("user", "meta-icon")}<div><span>Observer</span><strong>${escapeHtml(meta.observer)}</strong></div></div>
        </div>
        <div class="timer-block">
          <strong id="timer-display" class="timer-display">${formatTimer(elapsed)}</strong>
          <button class="button button-secondary timer-toggle" data-action="toggle-timer">
            ${icon(observation.timer.running ? "pause" : "play")}
            <span>${observation.timer.running ? "Pause" : "Resume"}</span>
          </button>
        </div>
        <div class="progress-block">
          <strong><span id="current-interval-number">${observation.currentIntervalIndex + 1}</span> of ${observation.intervals.length} intervals</strong>
          <div class="progress-track" aria-hidden="true"><span id="timer-progress" style="width:${progress}%"></span></div>
        </div>
      </section>
    `;
  }

  function renderCodeButtons(interval) {
    return DATA.codes
      .map((item) => {
        const selected = interval.codes.includes(item.code);
        return `
          <button
            type="button"
            class="code-button ${selected ? "is-selected" : ""}"
            data-action="toggle-code"
            data-code="${item.code}"
            aria-pressed="${selected}"
            title="${escapeHtml(item.definition)}"
          >
            <span class="code-copy"><strong>${item.code}</strong><span>${escapeHtml(item.shortLabel)}</span></span>
            <span class="code-check" aria-hidden="true">${icon("checkPlain")}</span>
          </button>
        `;
      })
      .join("");
  }

  function renderRecentIntervals(observation) {
    const recent = observation.intervals
      .slice(0, observation.currentIntervalIndex)
      .filter((interval) => interval.savedAt || interval.codes.length || interval.notes)
      .slice(-3)
      .reverse();
    if (!recent.length) {
      return '<p class="empty-inline">Saved intervals will appear here.</p>';
    }
    return recent
      .map(
        (interval) => `
          <button class="recent-row" data-action="jump-interval" data-index="${interval.index}">
            <span>${intervalLabel(interval)}</span>
            <span class="recent-codes">${escapeHtml(interval.codes.join(", ") || "No codes")}</span>
            <strong>${interval.codes.length}</strong>
            ${icon("arrowRight")}
          </button>
        `,
      )
      .join("");
  }

  function renderFrequencySummary(observation) {
    const ranked = SCORING.getRankedCodes(observation.intervals)
      .filter((item) => item.total > 0)
      .slice(0, 5);
    if (!ranked.length) {
      return '<p class="empty-inline">Frequency totals update as you save intervals.</p>';
    }
    const max = Math.max(...ranked.map((item) => item.total), 1);
    return ranked
      .map(
        (item) => `
          <div class="frequency-row">
            <span>${item.code}</span>
            <div class="mini-bar"><span style="width:${(item.total / max) * 100}%"></span></div>
            <strong>${item.total}</strong>
          </div>
        `,
      )
      .join("");
  }

  function renderContextEditor(observation) {
    const meta = observation.metadata;
    const level = (value) =>
      meta.classStructure === value ? " selected" : "";
    return `
      <details class="sidebar-section context-editor">
        <summary>Class details &amp; context</summary>
        <p class="context-editor-hint">Update these at any point during the observation.</p>
        <label class="field">
          <span>Class structure</span>
          <select data-meta="classStructure">
            <option value=""${meta.classStructure ? "" : " selected"}>Select level</option>
            <option value="Low"${level("Low")}>Low</option>
            <option value="Medium"${level("Medium")}>Medium</option>
            <option value="High"${level("High")}>High</option>
          </select>
        </label>
        <label class="field">
          <span>Pre-observation notes</span>
          <textarea data-meta="preObservationNotes" rows="3" maxlength="500" placeholder="Instructor's teaching goals for this session...">${escapeHtml(meta.preObservationNotes || "")}</textarea>
        </label>
        <label class="field">
          <span>Classroom arrangement</span>
          <textarea data-meta="classroomArrangement" rows="3" maxlength="500">${escapeHtml(meta.classroomArrangement || "")}</textarea>
        </label>
        <label class="field">
          <span>Group observations</span>
          <textarea data-meta="groupObservations" rows="3" maxlength="500">${escapeHtml(meta.groupObservations || "")}</textarea>
        </label>
        <label class="field">
          <span>Accessibility observations</span>
          <textarea data-meta="accessibilityObservations" rows="3" maxlength="500">${escapeHtml(meta.accessibilityObservations || "")}</textarea>
        </label>
      </details>
    `;
  }

  function renderObservation() {
    const observation = state.observation;
    if (!observation) return renderSetup();
    const interval = observation.intervals[observation.currentIntervalIndex];
    const isLast = observation.currentIntervalIndex === observation.intervals.length - 1;
    return `
      <main id="main-content" class="observation-page">
        ${renderMetaStrip(observation)}
        <div class="observation-layout">
          <section class="interval-workspace">
            <div class="workspace-heading">
              <div>
                <h1>Current interval ${intervalLabel(interval)}</h1>
                <p>Select all inclusive teaching behaviors observed during this interval.</p>
              </div>
              <button class="text-button print-hidden" data-action="open-guide">${icon("info")} Code definitions</button>
            </div>
            <div class="code-grid" aria-label="PAITE behavior codes">
              ${renderCodeButtons(interval)}
            </div>
            <div class="mobile-notes">
              <label class="field">
                <span>Interval notes <small>optional</small></span>
                <textarea id="mobile-interval-notes" data-role="interval-notes" rows="4" maxlength="1000" placeholder="Add notes about this interval...">${escapeHtml(interval.notes)}</textarea>
                <small class="character-count"><span data-role="notes-count">${interval.notes.length}</span> / 1000</small>
              </label>
              <div class="autosave-status">${icon("check")}<span>Autosaved</span></div>
            </div>
          </section>

          <aside class="observation-sidebar">
            <section class="sidebar-section notes-section">
              <label class="field">
                <span>Interval notes (${intervalLabel(interval)})</span>
                <textarea id="desktop-interval-notes" data-role="interval-notes" rows="5" maxlength="1000" placeholder="Add notes about this interval...">${escapeHtml(interval.notes)}</textarea>
                <small class="character-count"><span data-role="notes-count">${interval.notes.length}</span> / 1000</small>
              </label>
            </section>
            ${renderContextEditor(observation)}
            <section class="sidebar-section">
              <h2>Recent intervals</h2>
              <div class="recent-list">${renderRecentIntervals(observation)}</div>
            </section>
            <section class="sidebar-section">
              <h2>Frequency summary</h2>
              <div class="frequency-list">${renderFrequencySummary(observation)}</div>
              <button class="text-button summary-link" data-action="view-live-summary">View full frequency table</button>
            </section>
          </aside>
        </div>

        <footer class="observation-actions print-hidden">
          <button class="button button-secondary" data-action="previous-interval" ${observation.currentIntervalIndex === 0 ? "disabled" : ""}>
            ${icon("arrowLeft")} Back interval
          </button>
          <button class="button button-danger" data-action="clear-interval">${icon("trash")} Clear interval</button>
          <div id="autosave-label" class="autosave-status">${icon("check")}<span>Autosaved just now</span></div>
          <button class="button button-primary continue-button" data-action="save-continue">
            ${isLast ? "Save and review" : "Save interval and continue"} ${icon("arrowRight")}
          </button>
        </footer>
      </main>
    `;
  }

  function renderHistory() {
    const history = getHistory().sort(
      (a, b) => new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime(),
    );
    return `
      <main id="main-content" class="history-page content-page">
        <div class="page-heading-row">
          <div><h1>Observation history</h1><p>Completed observations saved in this browser.</p></div>
          <div class="page-heading-actions">
            <button class="button button-danger" data-action="clear-all-data">${icon("trash")} Clear all data</button>
            <button class="button button-primary" data-action="new-observation">New observation</button>
          </div>
        </div>
        ${
          history.length
            ? `<div class="history-list">${history.map(renderHistoryItem).join("")}</div>`
            : `<section class="empty-state">
                ${icon("clock", "empty-icon")}
                <h2>No completed observations yet</h2>
                <p>Finish an observation to see its frequency summary here.</p>
                <button class="button button-primary" data-action="go-observation">Start an observation</button>
              </section>`
        }
      </main>
    `;
  }

  function renderHistoryItem(observation) {
    const summary = SCORING.getSummary(observation.intervals || []);
    const meta = observation.metadata;
    return `
      <article class="history-row">
        <div class="history-date"><strong>${formatShortDate(meta.date)}</strong><span>${meta.classLength} min</span></div>
        <div class="history-main"><h2>${escapeHtml(meta.course)}</h2><p>${escapeHtml(instructorDisplay(meta))} · Observed by ${escapeHtml(meta.observer)}</p></div>
        <div class="history-stat"><strong>${summary.recordedCount}</strong><span>intervals</span></div>
        <div class="history-stat"><strong>${summary.practiceCount}</strong><span>practices</span></div>
        <div class="history-actions print-hidden">
          <button class="button button-secondary button-small" data-action="view-history" data-id="${observation.id}">View</button>
          <button class="icon-button" data-action="reopen-history" data-id="${observation.id}" title="Reopen observation">${icon("edit")}<span class="sr-only">Reopen</span></button>
          <button class="icon-button icon-button-danger" data-action="delete-history" data-id="${observation.id}" title="Delete observation">${icon("trash")}<span class="sr-only">Delete</span></button>
        </div>
      </article>
    `;
  }

  function formatShortDate(dateString) {
    if (!dateString) return "No date";
    const date = new Date(`${dateString}T12:00:00`);
    return new Intl.DateTimeFormat("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric",
    }).format(date);
  }

  function getSummaryObservation() {
    if (state.selectedHistoryId) {
      return getHistory().find((item) => item.id === state.selectedHistoryId) || null;
    }
    return state.observation;
  }

  function renderSummary() {
    const observation = getSummaryObservation();
    if (!observation) return renderHistory();
    const meta = observation.metadata;
    const summary = SCORING.getSummary(observation.intervals);
    const ranked = summary.ranked;
    const maxTotal = Math.max(...ranked.map((item) => item.total), 1);
    const recorded = SCORING.recordedIntervals(observation.intervals);
    return `
      <main id="main-content" class="summary-page content-page">
        <div class="summary-heading">
          <div>
            <p class="summary-date">${formatShortDate(meta.date)}</p>
            <h1>${escapeHtml(meta.course)} observation summary</h1>
            <p>${escapeHtml(instructorDisplay(meta))} · ${meta.studentCount} students present · Observed by ${escapeHtml(meta.observer)}</p>
          </div>
          <div class="summary-actions print-hidden">
            <button class="button button-secondary" data-action="export-csv">${icon("download")} Export CSV</button>
            <button class="button button-secondary" data-action="download-report">${icon("download")} Download report</button>
            <button class="button button-secondary" data-action="email-report">${icon("mail")} Email report</button>
            <button class="button button-primary" data-action="print-summary">${icon("print")} Print or save PDF</button>
          </div>
        </div>

        ${renderReportOptions()}

        <section class="summary-kpis" aria-label="Observation totals">
          <div><strong>${summary.recordedCount}</strong><span>Recorded intervals</span></div>
          <div><strong>${summary.practiceCount} of 15</strong><span>PAITE practices observed</span></div>
          <div><strong>${summary.totalCodeMarks}</strong><span>Total behavior marks</span></div>
          <div><strong>${formatTimer(getElapsedSeconds(observation))}</strong><span>Elapsed observation time</span></div>
        </section>

        <section class="summary-panel chart-panel">
          <div class="panel-heading"><div><h2>Code distribution</h2><p>Share of all ${summary.totalCodeMarks} recorded behavior marks, matching the PAITE data visualization template.</p></div></div>
          <div class="chart-layout">
            <div class="chart-figure">${renderPieSvg(observation)}</div>
            ${renderPieLegend(observation)}
          </div>
        </section>

        ${renderVizPanel(observation)}

        <section class="summary-panel">
          <div class="panel-heading"><div><h2>Behavior frequency</h2><p>Count and share of ${summary.recordedCount || 0} recorded intervals.</p></div></div>
          <div class="frequency-table" role="table" aria-label="PAITE behavior frequency">
            <div class="frequency-table-header" role="row"><span>Code</span><span>Behavior</span><span>Frequency</span><span>Intervals</span></div>
            ${ranked
              .map(
                (item) => `
                  <div class="frequency-table-row" role="row">
                    <strong>${item.code}</strong>
                    <span>${escapeHtml(item.label)}</span>
                    <span class="summary-bar"><i style="width:${(item.total / maxTotal) * 100}%"></i></span>
                    <span><strong>${item.total}</strong> <small>${item.percentage}%</small></span>
                  </div>
                `,
              )
              .join("")}
          </div>
        </section>

        <section class="summary-panel segment-panel">
          <div class="panel-heading"><div><h2>10-minute pattern</h2><p>Behavior counts grouped by the source worksheet’s 10-minute sections.</p></div></div>
          ${renderSegmentTable(summary.segments)}
        </section>

        <section class="summary-grid">
          <div class="summary-panel context-panel">
            <h2>Class context</h2>
            <dl class="context-list">
              <div><dt>Class structure</dt><dd>${escapeHtml(meta.classStructure || "Not recorded")}</dd></div>
              <div><dt>Classroom arrangement</dt><dd>${escapeHtml(meta.classroomArrangement || "Not recorded")}</dd></div>
              <div><dt>Group observations</dt><dd>${escapeHtml(meta.groupObservations || "Not recorded")}</dd></div>
              <div><dt>Accessibility observations</dt><dd>${escapeHtml(meta.accessibilityObservations || "Not recorded")}</dd></div>
            </dl>
          </div>
          <div class="summary-panel notes-panel">
            <h2>Interval notes</h2>
            ${
              recorded.some((item) => item.notes.trim())
                ? `<div class="summary-notes-list">${recorded
                    .filter((item) => item.notes.trim())
                    .map(
                      (item) => `<div><strong>${intervalLabel(item)}</strong><p>${escapeHtml(item.notes)}</p></div>`,
                    )
                    .join("")}</div>`
                : '<p class="empty-inline">No interval notes were recorded.</p>'
            }
          </div>
        </section>

        <section class="method-note">
          ${icon("info")}
          <div><h2>How to read this summary</h2><p>PAITE records the frequency of observed teaching behaviors. These counts are descriptive. They are not a composite quality score. Context-dependent codes, including EXCL, may remain at zero when no relevant event occurs.</p></div>
        </section>

        <footer class="source-footer">
          <p>${escapeHtml(DATA.sources.citation)}</p>
          <a href="${DATA.sources.codeGuide}" target="_blank" rel="noreferrer">PAITE code guide</a>
        </footer>
      </main>
    `;
  }

  function renderReportOptions() {
    const opts = state.reportOptions;
    const row = (key, label) => `
      <label class="report-option">
        <input type="checkbox" data-report-option="${key}" ${opts[key] ? "checked" : ""} />
        <span>${label}</span>
      </label>`;
    return `
      <section class="summary-panel report-options-panel print-hidden">
        <div class="panel-heading"><div><h2>Report contents</h2><p>Choose the graphs, charts, and tables to include in the downloaded and emailed report.</p></div></div>
        <h3 class="report-options-subhead">Charts and graphs</h3>
        <div class="report-options-grid">
          ${row("pie", "Pie chart")}
          ${row("donut", "Donut chart")}
          ${row("categorical", "Categorical pie chart")}
          ${row("barh", "Bar chart (horizontal)")}
          ${row("barv", "Bar chart (vertical)")}
          ${row("longitudinal", "Longitudinal bar chart")}
          ${row("stacked", "Stacked bar by time")}
          ${row("stackedpct", "Stacked bar % by time")}
        </div>
        <h3 class="report-options-subhead">Tables and sections</h3>
        <div class="report-options-grid">
          ${row("frequency", "Behavior frequency table")}
          ${row("segments", "10-minute pattern table")}
          ${row("notes", "Notes highlights")}
          ${row("context", "Class context")}
          ${row("suggestions", "Suggestions")}
        </div>
      </section>
    `;
  }

  function getPieData(observation) {
    return SCORING.getRankedCodes(observation.intervals).filter(
      (item) => item.total > 0,
    );
  }

  function pieSlicePath(cx, cy, r, startAngle, endAngle) {
    const toXY = (angle) => [
      cx + r * Math.cos(((angle - 90) * Math.PI) / 180),
      cy + r * Math.sin(((angle - 90) * Math.PI) / 180),
    ];
    const [x1, y1] = toXY(startAngle);
    const [x2, y2] = toXY(endAngle);
    const largeArc = endAngle - startAngle > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
  }

  function renderPieSvg(observation, size = 280) {
    const data = getPieData(observation);
    const totalMarks = data.reduce((sum, item) => sum + item.total, 0);
    if (!totalMarks) {
      return '<p class="empty-inline">No coded behaviors recorded yet.</p>';
    }
    const cx = size / 2;
    const cy = size / 2;
    const r = size / 2 - 4;
    let angle = 0;
    let shapes = "";
    if (data.length === 1) {
      shapes = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${CODE_COLORS[data[0].code] || "#868e96"}"><title>${data[0].code}: ${data[0].total} (100%)</title></circle>`;
    } else {
      shapes = data
        .map((item) => {
          const share = item.total / totalMarks;
          const start = angle;
          const end = angle + share * 360;
          angle = end;
          const pct = Math.round(share * 100);
          return `<path d="${pieSlicePath(cx, cy, r, start, end)}" fill="${CODE_COLORS[item.code] || "#868e96"}" stroke="#fff" stroke-width="1.5"><title>${item.code}: ${item.total} (${pct}%)</title></path>`;
        })
        .join("");
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Pie chart of observed PAITE behavior codes">${shapes}</svg>`;
  }

  function renderPieLegend(observation) {
    const data = getPieData(observation);
    const totalMarks = data.reduce((sum, item) => sum + item.total, 0);
    if (!totalMarks) return "";
    return `
      <ul class="pie-legend">
        ${data
          .map(
            (item) => `
              <li>
                <span class="legend-swatch" style="background:${CODE_COLORS[item.code] || "#868e96"}"></span>
                <span class="legend-label"><strong>${item.code}</strong> ${escapeHtml(item.shortLabel)}</span>
                <span class="legend-value">${item.total} · ${Math.round((item.total / totalMarks) * 100)}%</span>
              </li>
            `,
          )
          .join("")}
      </ul>
    `;
  }

  // ---------------------------------------------------------------------------
  // Data visualizations (matches the PAITE spreadsheet template tabs)
  // ---------------------------------------------------------------------------
  const CHART_CATEGORIES = [
    { name: "Science of Learning", color: "#1971c2", codes: ["PRIOR", "COMP", "EQPART", "ACTIVE"] },
    { name: "Social Psychological", color: "#0ca678", codes: ["AFFIRM", "GROW"] },
    { name: "Classroom Climate", color: "#e8590c", codes: ["COM", "REL", "NAME", "EXCL", "IDEN"] },
    { name: "UDL & CRT", color: "#9c36b5", codes: ["MED", "DIVEX", "REAL", "CHOICE"] },
    { name: "Other", color: "#868e96", codes: ["O"] },
  ];
  const SESSION_COLORS = ["#007b77", "#1971c2", "#e8590c", "#9c36b5", "#2f9e44", "#c2255c"];
  const CHART_TYPES = [
    { key: "donut", label: "Donut chart" },
    { key: "pie", label: "Pie chart" },
    { key: "categorical", label: "Categorical pie chart" },
    { key: "barh", label: "Bar chart (horizontal)" },
    { key: "barv", label: "Bar chart (vertical)" },
    { key: "longitudinal", label: "Longitudinal bar chart" },
    { key: "table", label: "Table" },
    { key: "stacked", label: "Stacked bar by time" },
    { key: "stackedpct", label: "Stacked bar % by time" },
  ];
  const EMPTY_CHART = '<p class="empty-inline">No coded behaviors recorded yet.</p>';

  function codeColor(code) {
    return CODE_COLORS[code] || "#868e96";
  }

  function orderedCodeTotals(observation) {
    const totals = SCORING.getCodeTotals(observation.intervals);
    return DATA.codes.map((c) => ({
      code: c.code,
      shortLabel: c.shortLabel,
      total: totals[c.code] || 0,
    }));
  }

  function codePieSlices(observation) {
    return getPieData(observation).map((it) => ({
      label: `${it.code} ${it.shortLabel}`,
      value: it.total,
      color: codeColor(it.code),
    }));
  }

  function categorySlices(observation) {
    const totals = SCORING.getCodeTotals(observation.intervals);
    return CHART_CATEGORIES.map((cat) => ({
      label: cat.name,
      value: cat.codes.reduce((sum, code) => sum + (totals[code] || 0), 0),
      color: cat.color,
    })).filter((item) => item.value > 0);
  }

  function drawSlicesSvg(slices, { size = 280, innerRatio = 0, ariaLabel = "Pie chart" } = {}) {
    const total = slices.reduce((sum, s) => sum + s.value, 0);
    if (!total) return EMPTY_CHART;
    const cx = size / 2;
    const cy = size / 2;
    const r = size / 2 - 4;
    let angle = 0;
    let shapes = "";
    if (slices.length === 1) {
      shapes = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${slices[0].color}"><title>${escapeHtml(slices[0].label)}: ${slices[0].value} (100%)</title></circle>`;
    } else {
      shapes = slices
        .map((item) => {
          const share = item.value / total;
          const start = angle;
          const end = angle + share * 360;
          angle = end;
          const pct = Math.round(share * 100);
          return `<path d="${pieSlicePath(cx, cy, r, start, end)}" fill="${item.color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(item.label)}: ${item.value} (${pct}%)</title></path>`;
        })
        .join("");
    }
    if (innerRatio > 0) {
      shapes += `<circle cx="${cx}" cy="${cy}" r="${(r * innerRatio).toFixed(1)}" fill="#fff" />`;
    }
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${escapeHtml(ariaLabel)}">${shapes}</svg>`;
  }

  function drawLegend(items) {
    const total = items.reduce((sum, it) => sum + it.value, 0);
    if (!total) return "";
    return `<ul class="pie-legend">${items
      .map(
        (it) => `<li><span class="legend-swatch" style="background:${it.color}"></span><span class="legend-label">${escapeHtml(it.label)}</span><span class="legend-value">${it.value}${total ? ` · ${Math.round((it.value / total) * 100)}%` : ""}</span></li>`,
      )
      .join("")}</ul>`;
  }

  function drawBarChart(bars, { horizontal, ariaLabel = "Bar chart" }) {
    const active = bars.filter((b) => b.value > 0);
    if (!active.length) return EMPTY_CHART;
    const max = Math.max(...bars.map((b) => b.value), 1);
    if (horizontal) {
      const labelW = 74;
      const chartW = 440;
      const rowH = 24;
      const gap = 7;
      const pad = 10;
      const width = labelW + chartW + 44;
      const height = pad * 2 + bars.length * (rowH + gap);
      const rows = bars
        .map((b, i) => {
          const y = pad + i * (rowH + gap);
          const w = (b.value / max) * chartW;
          return `<text x="${labelW - 6}" y="${y + rowH / 2}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#1c2321">${escapeHtml(b.code)}</text><rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="${rowH}" rx="3" fill="${b.color}"><title>${escapeHtml(b.code)}: ${b.value}</title></rect><text x="${labelW + w + 6}" y="${y + rowH / 2}" dominant-baseline="middle" font-size="11" fill="#4c5a56">${b.value}</text>`;
        })
        .join("");
      return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${escapeHtml(ariaLabel)}">${rows}</svg>`;
    }
    const colW = 30;
    const gap = 10;
    const pad = 12;
    const chartH = 220;
    const valueH = 16;
    const labelH = 44;
    const width = pad * 2 + bars.length * (colW + gap);
    const height = pad + valueH + chartH + labelH;
    const baseY = pad + valueH + chartH;
    const cols = bars
      .map((b, i) => {
        const x = pad + i * (colW + gap);
        const h = (b.value / max) * chartH;
        const y = baseY - h;
        const cxLabel = x + colW / 2;
        return `<rect x="${x}" y="${y.toFixed(1)}" width="${colW}" height="${h.toFixed(1)}" rx="3" fill="${b.color}"><title>${escapeHtml(b.code)}: ${b.value}</title></rect><text x="${cxLabel}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#4c5a56">${b.value}</text><text x="${cxLabel}" y="${baseY + 12}" text-anchor="end" font-size="10" fill="#1c2321" transform="rotate(-45 ${cxLabel} ${baseY + 12})">${escapeHtml(b.code)}</text>`;
      })
      .join("");
    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${escapeHtml(ariaLabel)}"><line x1="${pad}" y1="${baseY}" x2="${width - pad}" y2="${baseY}" stroke="#d5ddda" />${cols}</svg>`;
  }

  function getLongitudinalSessions(currentObs) {
    const seen = new Set();
    const all = [];
    if (currentObs) all.push(currentObs);
    getHistory().forEach((h) => all.push(h));
    const unique = [];
    all.forEach((o) => {
      if (!o || seen.has(o.id)) return;
      seen.add(o.id);
      unique.push(o);
    });
    unique.sort(
      (a, b) =>
        new Date(b.updatedAt || b.createdAt).getTime() -
        new Date(a.updatedAt || a.createdAt).getTime(),
    );
    return unique
      .slice(0, 6)
      .reverse()
      .map((o, i) => ({
        label: `Obs ${i + 1}`,
        totals: SCORING.getCodeTotals(o.intervals),
      }));
  }

  function drawLongitudinalChart(sessions) {
    if (!sessions.length) return EMPTY_CHART;
    const codes = DATA.codes.map((c) => c.code);
    const activeCodes = codes.filter((code) =>
      sessions.some((s) => (s.totals[code] || 0) > 0),
    );
    if (!activeCodes.length) return EMPTY_CHART;
    const n = sessions.length;
    const barW = n > 3 ? 6 : 10;
    const innerGap = 2;
    const groupGap = 16;
    const pad = 12;
    const chartH = 220;
    const valueH = 10;
    const labelH = 42;
    const groupW = n * barW + (n - 1) * innerGap;
    const width = pad * 2 + activeCodes.length * (groupW + groupGap);
    const height = pad + valueH + chartH + labelH;
    const baseY = pad + valueH + chartH;
    const max = Math.max(
      1,
      ...sessions.flatMap((s) => activeCodes.map((c) => s.totals[c] || 0)),
    );
    const groups = activeCodes
      .map((code, gi) => {
        const gx = pad + gi * (groupW + groupGap);
        const bars = sessions
          .map((s, si) => {
            const v = s.totals[code] || 0;
            const h = (v / max) * chartH;
            const x = gx + si * (barW + innerGap);
            return `<rect x="${x}" y="${(baseY - h).toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${SESSION_COLORS[si % SESSION_COLORS.length]}"><title>${escapeHtml(s.label)} — ${code}: ${v}</title></rect>`;
          })
          .join("");
        const labelX = gx + groupW / 2;
        return `${bars}<text x="${labelX}" y="${baseY + 12}" text-anchor="end" font-size="10" fill="#1c2321" transform="rotate(-45 ${labelX} ${baseY + 12})">${escapeHtml(code)}</text>`;
      })
      .join("");
    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Longitudinal bar chart across observation sessions"><line x1="${pad}" y1="${baseY}" x2="${width - pad}" y2="${baseY}" stroke="#d5ddda" />${groups}</svg>`;
  }

  function drawStackedByTime(segments, percent) {
    if (!segments.length) return EMPTY_CHART;
    const activeCodes = DATA.codes
      .filter((item) => segments.some((seg) => (seg.totals[item.code] || 0) > 0))
      .map((item) => item.code);
    if (!activeCodes.length) return EMPTY_CHART;
    const colW = 46;
    const gap = 18;
    const pad = 12;
    const chartH = 240;
    const valueH = 8;
    const labelH = 40;
    const width = pad * 2 + segments.length * (colW + gap);
    const height = pad + valueH + chartH + labelH;
    const baseY = pad + valueH + chartH;
    const totals = segments.map((seg) =>
      activeCodes.reduce((sum, code) => sum + (seg.totals[code] || 0), 0),
    );
    const maxTotal = Math.max(1, ...totals);
    const cols = segments
      .map((seg, i) => {
        const x = pad + i * (colW + gap);
        const colTotal = totals[i] || 0;
        const fullH = percent ? chartH : (colTotal / maxTotal) * chartH;
        let cursor = baseY - fullH;
        const stack = activeCodes
          .map((code) => {
            const v = seg.totals[code] || 0;
            if (!v) return "";
            const segH = percent
              ? colTotal
                ? (v / colTotal) * chartH
                : 0
              : (v / maxTotal) * chartH;
            const rect = `<rect x="${x}" y="${cursor.toFixed(1)}" width="${colW}" height="${segH.toFixed(1)}" fill="${codeColor(code)}"><title>${escapeHtml(code)} — ${seg.startMin}–${seg.endMin} min: ${v}</title></rect>`;
            cursor += segH;
            return rect;
          })
          .join("");
        const labelX = x + colW / 2;
        return `${stack}<text x="${labelX}" y="${baseY + 14}" text-anchor="middle" font-size="10" fill="#1c2321">${seg.startMin}–${seg.endMin}</text>`;
      })
      .join("");
    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Stacked bar chart of behavior codes by time interval"><line x1="${pad}" y1="${baseY}" x2="${width - pad}" y2="${baseY}" stroke="#d5ddda" />${cols}</svg>`;
  }

  function drawCodeTable(observation) {
    const rows = orderedCodeTotals(observation);
    return `<table class="freq viz-table">
  <thead><tr><th>PAITE Code</th><th>Behavior</th><th>Number of Occurrences</th></tr></thead>
  <tbody>${DATA.codes
    .map((c, i) => `<tr><td><strong>${c.code}</strong></td><td>${escapeHtml(c.label)}</td><td>${rows[i].total}</td></tr>`)
    .join("")}</tbody>
</table>`;
  }

  function activeCodeLegendItems(observation) {
    return orderedCodeTotals(observation)
      .filter((c) => c.total > 0)
      .map((c) => ({ label: `${c.code} ${c.shortLabel}`, value: c.total, color: codeColor(c.code) }));
  }

  function renderChartByType(key, observation) {
    switch (key) {
      case "donut":
        return (
          `<div class="viz-figure">${drawSlicesSvg(codePieSlices(observation), { innerRatio: 0.58, ariaLabel: "Donut chart of PAITE codes" })}</div>` +
          drawLegend(codePieSlices(observation))
        );
      case "pie":
        return (
          `<div class="viz-figure">${drawSlicesSvg(codePieSlices(observation), { ariaLabel: "Pie chart of PAITE codes" })}</div>` +
          drawLegend(codePieSlices(observation))
        );
      case "categorical":
        return (
          `<div class="viz-figure">${drawSlicesSvg(categorySlices(observation), { ariaLabel: "Categorical pie chart" })}</div>` +
          drawLegend(categorySlices(observation))
        );
      case "barh":
        return `<div class="viz-scroll">${drawBarChart(orderedCodeTotals(observation).map((c) => ({ code: c.code, value: c.total, color: codeColor(c.code) })), { horizontal: true, ariaLabel: "Horizontal bar chart of PAITE codes" })}</div>`;
      case "barv":
        return `<div class="viz-scroll">${drawBarChart(orderedCodeTotals(observation).map((c) => ({ code: c.code, value: c.total, color: codeColor(c.code) })), { horizontal: false, ariaLabel: "Vertical bar chart of PAITE codes" })}</div>`;
      case "longitudinal": {
        const sessions = getLongitudinalSessions(observation);
        const note =
          sessions.length < 2
            ? '<p class="viz-note">Only one observation is saved. Complete more observations to compare sessions.</p>'
            : "";
        return (
          `<div class="viz-scroll">${drawLongitudinalChart(sessions)}</div>` +
          drawLegend(sessions.map((s, i) => ({ label: s.label, value: 1, color: SESSION_COLORS[i % SESSION_COLORS.length] }))).replace(/ · \d+%/g, "") +
          note
        );
      }
      case "table":
        return drawCodeTable(observation);
      case "stacked":
        return (
          `<div class="viz-scroll">${drawStackedByTime(SCORING.getSegmentTotals(observation.intervals), false)}</div>` +
          drawLegend(activeCodeLegendItems(observation))
        );
      case "stackedpct":
        return (
          `<div class="viz-scroll">${drawStackedByTime(SCORING.getSegmentTotals(observation.intervals), true)}</div>` +
          drawLegend(activeCodeLegendItems(observation))
        );
      default:
        return EMPTY_CHART;
    }
  }

  function chartTitle(key) {
    const found = CHART_TYPES.find((t) => t.key === key);
    return found ? found.label : "Chart";
  }

  function renderVizPanel(observation) {
    return `
      <section class="summary-panel viz-panel">
        <div class="panel-heading"><div><h2>Data visualizations</h2><p>Generate charts, graphs, and tables from this observation, matching the PAITE visualization template.</p></div></div>
        <label class="field viz-select-field print-hidden">
          <span>Chart type</span>
          <select data-role="chart-type">
            ${CHART_TYPES.map((t) => `<option value="${t.key}" ${state.chartType === t.key ? "selected" : ""}>${t.label}</option>`).join("")}
          </select>
        </label>
        <div id="viz-output" class="viz-output">${renderChartByType(state.chartType, observation)}</div>
      </section>
    `;
  }

  function renderSegmentTable(segments) {
    if (!segments.length) return '<p class="empty-inline">No recorded intervals yet.</p>';
    const activeCodes = DATA.codes
      .filter((item) => segments.some((segment) => segment.totals[item.code] > 0))
      .map((item) => item.code);
    return `
      <div class="segment-table-wrap">
        <table class="segment-table">
          <thead><tr><th>Segment</th><th>Intervals</th>${activeCodes.map((code) => `<th>${code}</th>`).join("")}</tr></thead>
          <tbody>${segments
            .map(
              (segment) => `<tr><th>${segment.startMin}–${segment.endMin} min</th><td>${segment.intervalCount}</td>${activeCodes
                .map((code) => `<td>${segment.totals[code]}</td>`)
                .join("")}</tr>`,
            )
            .join("")}</tbody>
        </table>
      </div>
    `;
  }

  function renderGuide() {
    if (!state.guideOpen) return "";
    return `
      <div class="modal-backdrop" data-action="close-guide">
        <section class="guide-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title" data-modal-panel>
          <div class="modal-heading">
            <div><h1 id="guide-title">PAITE code guide</h1><p>Use each code once per 2-minute interval when the behavior occurs.</p></div>
            <button class="icon-button" data-action="close-guide">${icon("close")}<span class="sr-only">Close</span></button>
          </div>
          <div class="guide-list">
            ${DATA.codes
              .map(
                (item) => `<article><strong>${item.code}</strong><div><h2>${escapeHtml(item.label)}</h2><p>${escapeHtml(item.definition)}</p></div></article>`,
              )
              .join("")}
          </div>
          <div class="modal-footer">
            <a class="text-link" href="${DATA.sources.codeGuide}" target="_blank" rel="noreferrer">Open source code guide</a>
            <button class="button button-primary" data-action="close-guide">Done</button>
          </div>
        </section>
      </div>
    `;
  }

  function render() {
    let content = "";
    if (state.screen === "observation") content = renderObservation();
    else if (state.screen === "history") content = renderHistory();
    else if (state.screen === "summary") content = renderSummary();
    else content = renderSetup();

    app.innerHTML = `${renderHeader()}${content}${renderGuide()}`;
    document.body.classList.toggle("modal-open", state.guideOpen);
    state.mobileNavOpen = false;
  }

  function updateTimerDOM() {
    if (state.screen !== "observation" || !state.observation) return;
    const elapsed = getElapsedSeconds();
    const display = document.getElementById("timer-display");
    const progress = document.getElementById("timer-progress");
    if (display) display.textContent = formatTimer(elapsed);
    if (progress) {
      progress.style.width = `${Math.min(100, (elapsed / (state.observation.metadata.classLength * 60)) * 100)}%`;
    }
    if (
      elapsed >= state.observation.metadata.classLength * 60 &&
      state.observation.timer.running
    ) {
      syncTimer();
      state.observation.timer.running = false;
      state.observation.timer.lastStartedAt = null;
      persistDraft();
      announce("The planned class length has been reached. The timer is paused.");
      render();
      return;
    }

    const timedIndex = Math.min(
      Math.floor(elapsed / (DATA.intervalMinutes * 60)),
      state.observation.intervals.length - 1,
    );
    if (timedIndex > state.observation.currentIntervalIndex) {
      const current = state.observation.intervals[state.observation.currentIntervalIndex];
      current.savedAt = current.savedAt || new Date().toISOString();
      state.observation.currentIntervalIndex = timedIndex;
      persistDraft();
      announce(`Moved to interval ${intervalLabel(state.observation.intervals[timedIndex])}.`);
      render();
    }
  }

  function updateAutosaveLabel() {
    const label = document.getElementById("autosave-label");
    if (label) label.querySelector("span").textContent = "Autosaved just now";
  }

  function currentInterval() {
    return state.observation.intervals[state.observation.currentIntervalIndex];
  }

  function saveCurrentInterval() {
    const interval = currentInterval();
    interval.savedAt = new Date().toISOString();
    persistDraft();
  }

  function finishObservation() {
    if (!state.observation) return;
    syncTimer();
    saveCurrentInterval();
    const observation = state.observation;
    observation.status = "completed";
    observation.completedAt = new Date().toISOString();
    observation.updatedAt = observation.completedAt;
    observation.timer.running = false;
    observation.timer.lastStartedAt = null;
    const history = getHistory();
    const existingIndex = history.findIndex((item) => item.id === observation.id);
    if (existingIndex >= 0) history[existingIndex] = observation;
    else history.unshift(observation);
    saveHistory(history);
    storage.removeItem(DRAFT_KEY);
    state.selectedHistoryId = observation.id;
    state.screen = "summary";
    render();
    window.scrollTo(0, 0);
    announce("Observation saved. Summary ready.");
  }

  function clearAllData() {
    if (
      !window.confirm(
        "Clear all data from this browser? This permanently removes the active draft and every saved observation on this device. This cannot be undone.",
      )
    ) {
      return;
    }
    storage.removeItem(DRAFT_KEY);
    storage.removeItem(HISTORY_KEY);
    state.observation = null;
    state.selectedHistoryId = null;
    state.screen = "setup";
    render();
    window.scrollTo(0, 0);
    announce("All data cleared from this browser.");
  }

  function goToScreen(screen) {
    state.screen = screen;
    state.selectedHistoryId = null;
    render();
    window.scrollTo(0, 0);
  }

  function fillDemoData() {
    const form = document.getElementById("setup-form");
    if (!form) return;
    form.elements.course.value = "BIO 204";
    form.elements.instructorId.value = "Dr. Rivera (FAC-1042)";
    form.elements.instructorEmail.value = "rivera@example.edu";
    form.elements.studentCount.value = "24";
    form.elements.observer.value = "M. Chen";
    form.elements.classLength.value = "90";
    form.elements.classStructure.value = "Medium";
    form.elements.preObservationNotes.value =
      "Instructor wants to increase active learning and check comprehension more often.";
    form.elements.classroomArrangement.value =
      "Seminar tables arranged in four groups with a clear center aisle.";
    form.elements.groupObservations.value =
      "Groups were assigned before class and included rotating discussion roles.";
    form.elements.accessibilityObservations.value =
      "Slides used high contrast and captions. Materials were shared in advance.";
    announce("Demo observation details added.");
  }

  function handleAction(action, target) {
    if (action === "toggle-mobile-nav") {
      state.mobileNavOpen = !state.mobileNavOpen;
      render();
      return;
    }
    if (action === "open-guide") {
      state.guideOpen = true;
      render();
      window.setTimeout(() => document.querySelector(".guide-modal .icon-button")?.focus(), 30);
      return;
    }
    if (action === "close-guide") {
      state.guideOpen = false;
      render();
      return;
    }
    if (action === "go-history") return goToScreen("history");
    if (action === "go-observation") {
      return goToScreen(state.observation?.status === "active" ? "observation" : "setup");
    }
    if (action === "go-setup" || action === "new-observation") {
      if (
        state.observation?.status === "active" &&
        !window.confirm("Start a new observation and remove the current draft from this browser?")
      ) {
        return;
      }
      if (state.observation?.status === "active") storage.removeItem(DRAFT_KEY);
      state.observation = null;
      return goToScreen("setup");
    }
    if (action === "fill-demo") return fillDemoData();
    if (action === "clear-all-data") return clearAllData();
    const worksWithoutObservation = [
      "view-history",
      "delete-history",
      "reopen-history",
      "export-csv",
      "download-report",
      "email-report",
      "print-summary",
    ];
    if (!state.observation && !worksWithoutObservation.includes(action)) return;

    if (action === "toggle-timer") {
      const timer = state.observation.timer;
      if (timer.running) {
        timer.elapsedSeconds = getElapsedSeconds();
        timer.running = false;
        timer.lastStartedAt = null;
      } else {
        timer.running = true;
        timer.lastStartedAt = new Date().toISOString();
      }
      persistDraft();
      render();
      return;
    }
    if (action === "toggle-code") {
      const code = target.dataset.code;
      const interval = currentInterval();
      interval.codes = interval.codes.includes(code)
        ? interval.codes.filter((item) => item !== code)
        : [...interval.codes, code];
      persistDraft();
      render();
      document.querySelector(`[data-code="${code}"]`)?.focus();
      announce(`${code} ${interval.codes.includes(code) ? "selected" : "cleared"}.`);
      return;
    }
    if (action === "previous-interval") {
      saveCurrentInterval();
      state.observation.currentIntervalIndex = Math.max(
        0,
        state.observation.currentIntervalIndex - 1,
      );
      persistDraft();
      render();
      return;
    }
    if (action === "jump-interval") {
      saveCurrentInterval();
      state.observation.currentIntervalIndex = Number(target.dataset.index);
      persistDraft();
      render();
      return;
    }
    if (action === "clear-interval") {
      if (!window.confirm("Clear the selected codes and notes for this interval?")) return;
      const interval = currentInterval();
      interval.codes = [];
      interval.notes = "";
      interval.savedAt = null;
      persistDraft();
      render();
      announce("Interval cleared.");
      return;
    }
    if (action === "save-continue") {
      saveCurrentInterval();
      if (state.observation.currentIntervalIndex < state.observation.intervals.length - 1) {
        state.observation.currentIntervalIndex += 1;
        persistDraft();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        announce(`Saved. Current interval is ${intervalLabel(currentInterval())}.`);
      } else {
        finishObservation();
      }
      return;
    }
    if (action === "finish-observation") return finishObservation();
    if (action === "view-live-summary") {
      saveCurrentInterval();
      state.selectedHistoryId = null;
      state.screen = "summary";
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "view-history") {
      state.selectedHistoryId = target.dataset.id;
      state.screen = "summary";
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === "reopen-history") {
      const item = getHistory().find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      const copy = normalizeObservation(JSON.parse(JSON.stringify(item)));
      copy.status = "active";
      copy.completedAt = null;
      copy.timer.running = false;
      copy.timer.lastStartedAt = null;
      state.observation = copy;
      state.screen = "observation";
      state.selectedHistoryId = null;
      persistDraft();
      render();
      announce("Observation reopened as an active draft.");
      return;
    }
    if (action === "delete-history") {
      const history = getHistory();
      const item = history.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      if (!window.confirm(`Delete the saved observation for ${item.metadata.course}?`)) return;
      saveHistory(history.filter((entry) => entry.id !== item.id));
      render();
      announce("Saved observation deleted.");
      return;
    }
    if (action === "export-csv") return exportCsv();
    if (action === "download-report") return downloadReport();
    if (action === "email-report") return emailReport();
    if (action === "print-summary") return window.print();
  }

  function exportCsv() {
    const observation = getSummaryObservation();
    if (!observation) return;
    const meta = observation.metadata;
    const rows = [
      ["PAITE Classroom Observation"],
      ["Date", meta.date],
      ["Course", meta.course],
      ["Instructor Name or ID", instructorDisplay(meta)],
      ["Instructor email", meta.instructorEmail || ""],
      ["Students present", meta.studentCount],
      ["Observer", meta.observer],
      ["Class length", meta.classLength],
      ["Class structure", meta.classStructure || ""],
      ["Pre-observation notes", meta.preObservationNotes || ""],
      [],
      ["Interval", ...DATA.codes.map((item) => item.code), "Comments"],
      ...observation.intervals.map((interval) => [
        intervalLabel(interval),
        ...DATA.codes.map((item) => (interval.codes.includes(item.code) ? 1 : "")),
        interval.notes,
      ]),
      [],
      [
        "TOTALS",
        ...DATA.codes.map(
          (item) => SCORING.getCodeTotals(observation.intervals)[item.code],
        ),
        "",
      ],
    ];
    const csv = rows
      .map((row) =>
        row
          .map((cell) => `"${String(cell ?? "").replaceAll('"', '""')}"`)
          .join(","),
      )
      .join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `paite-${meta.course || "observation"}-${meta.date || "export"}`
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, "-")
      .replace(/-+/g, "-")
      .concat(".csv");
    link.click();
    URL.revokeObjectURL(link.href);
    announce("CSV export created.");
  }

  function buildReportSegmentTable(segments) {
    if (!segments.length) return "<p><em>No recorded intervals yet.</em></p>";
    const activeCodes = DATA.codes
      .filter((item) => segments.some((segment) => segment.totals[item.code] > 0))
      .map((item) => item.code);
    return `<table class="freq">
  <thead><tr><th>Segment</th><th>Intervals</th>${activeCodes.map((code) => `<th>${code}</th>`).join("")}</tr></thead>
  <tbody>${segments
    .map(
      (segment) => `<tr><td>${segment.startMin}–${segment.endMin} min</td><td>${segment.intervalCount}</td>${activeCodes
        .map((code) => `<td>${segment.totals[code]}</td>`)
        .join("")}</tr>`,
    )
    .join("")}</tbody>
</table>`;
  }

  function reportChartsHtml(observation) {
    const opts = state.reportOptions;

      "pie",
      "donut",
      "categorical",
      "barh",
      "barv",
      "longitudinal",
      "stacked",
      "stackedpct",
    ];
    return chartKeys
      .filter((key) => opts[key])
      .map(
        (key) => `<h2>${chartTitle(key)}</h2>\n<div class="viz-chart-block">${renderChartByType(key, observation)}</div>`,
      )
      .join("\n");
  }

  function buildReportHtml(observation) {

    const ranked = summary.ranked;

    const growthAreas = ranked
      .filter(
        (item) =>
          item.total === 0 &&
          item.code !== "O" &&
          item.code !== "EXCL" &&
          item.code !== "IDEN",
      )
      .slice(0, 3);
    const recorded = SCORING.recordedIntervals(observation.intervals);
    const notedIntervals = recorded.filter((item) => item.notes.trim());
    const frequencyRows = ranked
      .map(
        (item) => `<tr><td><strong>${item.code}</strong></td><td>${escapeHtml(item.label)}</td><td>${item.total}</td><td>${item.percentage}%</td></tr>`,
      )
      .join("");
    const hasContext =
      meta.preObservationNotes ||
      meta.classroomArrangement ||
      meta.groupObservations ||
      meta.accessibilityObservations;
    return `<!doctype html>
<html lang="en">
<head>

</style>
</head>
<body>

${
  opts.notes
    ? `<h2>Notes</h2>
<p>Highlights from the observation:</p>
${
  notedIntervals.length
    ? notedIntervals
        .map(
          (item) => `<div class="note-block"><strong>${intervalLabel(item)}:</strong> ${escapeHtml(item.notes)}</div>`,
        )
        .join("")
    : "<p><em>No interval notes were recorded. The observer may add additional observational feedback here.</em></p>"
}`
    : ""
}

${
  opts.context && hasContext
    ? `<h2>Class Context</h2>
${meta.preObservationNotes ? `<div class="note-block"><strong>Pre-observation notes:</strong> ${escapeHtml(meta.preObservationNotes)}</div>` : ""}
${meta.classroomArrangement ? `<div class="note-block"><strong>Classroom arrangement:</strong> ${escapeHtml(meta.classroomArrangement)}</div>` : ""}
${meta.groupObservations ? `<div class="note-block"><strong>Group observations:</strong> ${escapeHtml(meta.groupObservations)}</div>` : ""}
${meta.accessibilityObservations ? `<div class="note-block"><strong>Accessibility observations:</strong> ${escapeHtml(meta.accessibilityObservations)}</div>` : ""}`
    : ""
}

${
  opts.suggestions
    ? `<h2>Suggestions</h2>
${
  growthAreas.length
    ? `<p>Three top teaching practices to consider implementing in the future:</p>
<ul>${growthAreas.map((item) => `<li><strong>${escapeHtml(item.label)}</strong> (${item.code}): ${escapeHtml(item.definition)}</li>`).join("")}</ul>`
    : "<p>All applicable PAITE practices were observed at least once. Continue reinforcing the practices above.</p>"
}`
    : ""
}
<p><em>Note: PAITE counts are descriptive, not a composite quality score. Context-dependent codes, including EXCL and IDEN, may remain at zero when no relevant event occurred during the observed session.</em></p>

<p class="citation">${escapeHtml(DATA.sources.citation)}</p>
</body>
</html>`;
  }

  function downloadReport() {
    const observation = getSummaryObservation();
    if (!observation) return;
    const meta = observation.metadata;
    const blob = new Blob([buildReportHtml(observation)], {
      type: "text/html;charset=utf-8",
    });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `paite-report-${meta.course || "observation"}-${meta.date || ""}`
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, "-")
      .replace(/-+/g, "-")
      .replace(/-$/, "")
      .concat(".html");
    link.click();
    URL.revokeObjectURL(link.href);
    announce("Post-observation report downloaded.");
  }

  function emailReport() {
    const observation = getSummaryObservation();
    if (!observation) return;
    const meta = observation.metadata;
    downloadReport();
    const to = encodeURIComponent(meta.instructorEmail || "");
    const subject = encodeURIComponent(
      `PAITE observation report — ${meta.course || "class"} — ${meta.date || ""}`.trim(),
    );
    const body = encodeURIComponent(
      `Hello,\n\nThe PAITE post-observation report for ${meta.course || "your class"} has been downloaded to this device. Please attach the report file to this email before sending.\n\nBest,\n${meta.observer || ""}`,
    );
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    announce(
      "Report downloaded and email drafted. Attach the downloaded file before sending.",
    );
  }

  app.addEventListener("submit", (event) => {
    if (event.target.id !== "setup-form") return;
    event.preventDefault();
    const formData = new FormData(event.target);
    state.observation = createObservation(formData);
    state.screen = "observation";
    persistDraft();
    render();
    window.scrollTo(0, 0);
    announce("Observation started. Timer running.");
  });

  app.addEventListener("click", (event) => {
    if (event.target.closest("[data-modal-panel]") && !event.target.closest("[data-action]")) {
      event.stopPropagation();
      return;
    }
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (action === "close-guide" && event.target.closest("[data-modal-panel]") && !event.target.closest("button")) {
      return;
    }
    handleAction(action, target);
  });

  function updateMetaField(target) {
    if (!state.observation || !target.dataset.meta) return false;
    state.observation.metadata[target.dataset.meta] = target.value;
    persistDraft();
    return true;
  }

  app.addEventListener("input", (event) => {
    const target = event.target;
    if (target.dataset.meta) {
      updateMetaField(target);
      return;
    }
    if (target.dataset.role !== "interval-notes" || !state.observation) return;
    currentInterval().notes = target.value;
    document.querySelectorAll('[data-role="notes-count"]').forEach((node) => {
      node.textContent = String(target.value.length);
    });
    document.querySelectorAll('[data-role="interval-notes"]').forEach((node) => {
      if (node !== target) node.value = target.value;
    });
    persistDraft();
  });

  app.addEventListener("change", (event) => {
    if (event.target.dataset.meta) updateMetaField(event.target);
    if (event.target.dataset.reportOption) {
      state.reportOptions[event.target.dataset.reportOption] = event.target.checked;
    }
    if (event.target.dataset.role === "chart-type") {
      state.chartType = event.target.value;
      const output = document.getElementById("viz-output");
      const observation = getSummaryObservation();
      if (output && observation) {
        output.innerHTML = renderChartByType(state.chartType, observation);
      }
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && state.guideOpen) {
      state.guideOpen = false;
      render();
    }
  });

  loadInitialState();
  render();
  window.setInterval(updateTimerDOM, 1000);
})();

</script>
  </body>
</html>
